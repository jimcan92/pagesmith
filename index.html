<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagesmith</title>
<link rel="stylesheet" href="css/app.css">
<style id="pageSizeStyle"></style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">P</span>
    <div>
      <div class="brand-title">Pagesmith</div>
      <input id="projectName" class="project-name" spellcheck="false" aria-label="Document name">
    </div>
  </div>
  <div class="top-actions">
    <span id="saveStatus" class="save-status">—</span>
    <button class="btn" id="btnNew" title="Start a new document">New</button>
    <button class="btn" id="btnOpen" title="Open a saved .pagesmith.json file">Open</button>
    <button class="btn" id="btnSaveFile" title="Download the document so you can continue on another computer or share it">Save file</button>
    <button class="btn" id="btnTemplate" title="Cover, backgrounds, margins, paper size, page numbers">Template</button>
    <button class="btn primary" id="btnExport" title="Print or save as PDF">Export PDF</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <section class="panel pages-panel">
      <div class="panel-head">
        <h2>Pages <span id="pageCount" class="muted"></span></h2>
      </div>
      <div class="add-row">
        <button class="btn sm" data-add="portrait"><span class="ico-p"></span>Portrait</button>
        <button class="btn sm" data-add="landscape"><span class="ico-l"></span>Landscape</button>
        <button class="btn sm" data-add="special" title="A page with one of your special backgrounds">Special…</button>
        <button class="btn sm" data-add="cover" title="The document's cover (one per document)">Cover</button>
        <button class="btn sm" data-add="photos" title="Add many photos at once — pages are created automatically">Photos…</button>
        <button class="btn sm" data-add="pdf" title="Each PDF page becomes one page (landscape pages stay landscape)">PDF…</button>
        <button class="btn sm" data-add="word" title="Bring in an existing Word document (.docx): text, tables and pictures become editable pages">Word…</button>
      </div>
      <ol id="pageList" class="page-list"></ol>
    </section>
    <section class="panel editor-panel" id="editor"></section>
  </aside>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       title="Drag to make the preview bigger or smaller (double-click to reset)"></div>

  <section class="preview" id="preview">
    <div class="preview-bar">
      <span class="muted">Preview — this is exactly what will print</span>
      <label class="zoom">Zoom
        <select id="zoom">
          <option value="fit">Fit</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
        </select>
      </label>
    </div>
    <div id="previewPages" class="preview-pages"></div>
  </section>
</main>

<!-- hidden file inputs -->
<input type="file" id="fileOpen" accept=".json,application/json" hidden>
<input type="file" id="filePhotos" accept="image/*" multiple hidden>
<input type="file" id="filePdf" accept="application/pdf" multiple hidden>
<input type="file" id="fileAttach" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileDocx" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- PDF import (pdf.js). Needs internet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<!-- Word import (JSZip). Needs internet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/defaults.js"></script>
<script src="js/docx-import.js"></script>
<script src="js/app.js"></script>
</body>
</html>
